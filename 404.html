<!DOCTYPE html>
<html lang="it" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Naturale</title>
    <script>
        // Qualsiasi indirizzo scritto in modo diverso (es. /calendario-naturale/ in minuscolo)
        // porta al Calendario Naturale, mantenendo ?data=, &ora= e &lang=.
        var percorso = location.pathname.replace(/^\/calendario-naturale/i, "");
        if (percorso === location.pathname) percorso = "/";
        location.replace("/Calendario-Naturale" + percorso + location.search + location.hash);
    </script>
</head>
<body style="background:#1b2452;color:#fff;font-family:sans-serif;text-align:center;padding:40px 16px">
    <p><a style="color:#5eead4" href="/Calendario-Naturale/">Calendario Naturale 🐢</a></p>
</body>
</html>
